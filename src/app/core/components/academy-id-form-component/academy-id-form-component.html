<div class="building-form relative">
  <div class="close img pointer" mat-dialog-close>
    <img src="/icons/close.svg" alt="close icon" width="25" />
  </div>

  <div class="text-center" mat-dialog-title>
    <h1>{{ (this.data.academyId ? "edit_academy" : "add_academy") | translate }}</h1>
  </div>

  <ng-container *ngIf="!dialogContentLoading">
    <div mat-dialog-content>
      <form [formGroup]="form">
        <div class="flex-grid">
          <div class="col-lg-12">
            <div class="name mb-1">
              <escoba-input key="academy_name" [control]="f['nameEn']">
                <input type="text" class="input" formControlName="nameEn" />
              </escoba-input>
            </div>
          </div>

          <div class="col-lg-12">
            <div class="name mb-1">
              <escoba-input key="phone_number" [control]="f['nameAr']">
                <input type="text" class="input" formControlName="nameAr" />
              </escoba-input>
            </div>
          </div>
        </div>
      </form>
    </div>
  </ng-container>
  <ng-container *ngIf="dialogContentLoading">
    <div class="py-5">
      <loading />
    </div>
  </ng-container>

  <div mat-dialog-actions>
    <button
      class="clickable-btn bg-primary py-50 w-100 rounded bold fs-18 mb-1"
      [disabled]="this.form.invalid || this.form.untouched || loading"
      (click)="submit()"
    >
      <submit-button [loading]="loading" [text]="'save'" />
    </button>
  </div>
</div>
